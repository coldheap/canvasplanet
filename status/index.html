<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Current service status and uptime history for CanvasPlanet." />
  <title>CanvasPlanet Status</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236b7280'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/status.css?v=3" />
  <script src="/status.js?v=3" defer></script>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="https://canvasplanet.net/" aria-label="CanvasPlanet home">
        <strong>CanvasPlanet</strong><span>Status</span>
      </a>
      <a class="canvas-link" href="https://canvasplanet.net/">Open Canvas</a>
    </div>
  </header>

  <main class="wrap">
    <section class="status-banner unknown" id="status-banner" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <h1 id="status-title">Checking system status</h1>
      <span id="status-age">Connecting…</span>
      <p id="status-detail" hidden></p>
    </section>

    <section aria-labelledby="systems-title">
      <div class="section-heading">
        <h2 id="systems-title">Uptime over the past 90 days</h2>
        <span id="coverage"></span>
      </div>
      <p class="error" id="history-error" role="status" hidden>
        Uptime history is unavailable. <button id="history-retry" type="button">Retry</button>
      </p>
      <div class="components" id="component-list"></div>
      <div class="legend" aria-label="Status legend">
        <span><i class="operational"></i>Operational</span>
        <span><i class="degraded"></i>Degraded</span>
        <span><i class="down"></i>Unavailable</span>
        <span><i class="nodata"></i>No data</span>
      </div>
    </section>

    <section class="incidents" aria-labelledby="incidents-title">
      <h2 id="incidents-title">Past incidents</h2>
      <div id="incident-list"><p class="muted">Loading…</p></div>
    </section>
  </main>

  <footer class="wrap">
    <span id="last-checked">No successful check yet</span>
    <span>Health is recorded every 5 minutes</span>
  </footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
