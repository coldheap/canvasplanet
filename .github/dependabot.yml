# Dependency updates. Grouped and monthly on purpose: this is a small
# project, and a daily stream of individual bumps is noise that trains you
# to merge without looking. Security advisories are delivered separately by
# Dependabot alerts and are not throttled by this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch/minor churn across the workspace.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors here are deliberate migrations, not a bot's job. The CI
      # workflow and the Dockerfile pin runtime versions on purpose and are
      # updated by hand together with their comments.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /packages/server
    schedule:
      interval: monthly
